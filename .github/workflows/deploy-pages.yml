name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/dazzling-cray-xxzxuy
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the
# run in-progress and latest queued. Do not cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (with GitHub Actions as the source) if it
          # hasn't been turned on yet, so no manual settings step is needed.
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          # The site lives at the repository root (index.html)
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
